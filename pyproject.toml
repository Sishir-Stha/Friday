[project]
name = "friday"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sishir Shrestha", email = "sishershrestha000@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "package-name>=0.1",
    "psutil>=7.2.2",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pyside6>=6.11.1",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
friday = "friday.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]
